<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サーバーレス 連続クイズメーカー</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --success: #10b981;
      --error: #ef4444;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; transition: all 0.2s ease; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container { width: 100%; max-width: 580px; }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 20px;
    }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; margin: 0 0 8px 0; font-weight: 700; }
    .header p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }

    /* 問題作成ブロック */
    .q-block {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
    }

    .q-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-title { font-weight: 700; font-size: 0.95rem; }
    
    .btn-delete {
      background: #fee2e2;
      color: var(--error);
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-delete:hover { background: #fca5a5; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    .option-input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .option-input-group input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .btn-secondary {
      background: #ffffff;
      color: var(--primary);
      border: 2px solid var(--primary);
      margin-bottom: 16px;
    }
    .btn-secondary:hover { background: #f0f3ff; }

    /* プログレスバー & バッジ */
    .badge {
      background: #e0e7ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
    }

    .progress-container {
      width: 100%;
      background: var(--border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
    }

    /* 回答ボタン */
    .quiz-option-btn {
      width: 100%;
      padding: 16px;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: left;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .quiz-option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f3ff; }
    .quiz-option-btn.correct { background: #ecfdf5; border-color: var(--success); color: #065f46; font-weight: 700; }
    .quiz-option-btn.incorrect { background: #fef2f2; border-color: var(--error); color: #991b1b; }

    #share-area {
      margin-top: 20px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px dashed var(--border);
      text-align: center;
    }
    #share-url { word-break: break-all; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- 作成モード -->
  <div id="create-mode" class="card">
    <div class="header">
      <h1>Quiz Maker</h1>
      <p>複数問作れる連続クイズ作成ツール</p>
    </div>

    <div id="questions-container"></div>

    <button class="btn btn-secondary" onclick="addQuestionBlock()">＋ 問題を追加する</button>
    <button class="btn" onclick="generateQuiz()">クイズURLを発行する</button>

    <div id="share-area" class="hidden">
      <div id="share-url"></div>
      <button class="btn" onclick="copyUrl()" id="copy-btn">URLをコピー</button>
    </div>
  </div>

  <!-- 回答モード -->
  <div id="play-mode" class="card hidden">
    <div class="header">
      <span id="quiz-badge" class="badge">問 1 / 1</span>
      <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
      <h2 id="quiz-question" style="margin: 0; font-size: 1.3rem;"></h2>
    </div>

    <div id="options-container"></div>
    <div id="result-message" style="text-align: center; font-weight: bold; margin-top: 12px; height: 28px;"></div>
    <button id="next-btn" class="btn hidden" onclick="nextQuestion()" style="margin-top: 16px;">次の問題へ</button>
  </div>

  <!-- スコア表示モード -->
  <div id="score-mode" class="card hidden" style="text-align: center;">
    <div class="header">
      <h1>クイズ終了！ 🎉</h1>
      <p>あなたの回答結果</p>
    </div>
    <div id="score-display" style="font-size: 3rem; font-weight: 800; color: var(--primary); margin: 20px 0;"></div>
    <button class="btn" onclick="restartQuiz()">もう一度挑戦する</button>
  </div>
</div>

<script>
  let qCount = 0;
  let currentQuizData = [];
  let currentQIndex = 0;
  let score = 0;

  async function sha256(msg) {
    const uint8 = new TextEncoder().encode(msg);
    const buf = await crypto.subtle.digest('SHA-256', uint8);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function encodeData(data) {
    return btoa(encodeURIComponent(JSON.stringify(data)).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
  }

  function decodeData(str) {
    return JSON.parse(decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }

  function generateSalt() {
    return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // 作成モード：問題ブロックを追加
  function addQuestionBlock() {
    qCount++;
    const container = document.getElementById('questions-container');
    const block = document.createElement('div');
    block.className = 'q-block';
    block.id = `q-block-${qCount}`;
    block.innerHTML = `
      <div class="q-block-header">
        <span class="q-title">問題 ${qCount}</span>
        ${qCount > 1 ? `<button class="btn-delete" onclick="removeQuestionBlock(${qCount})">削除</button>` : ''}
      </div>
      <div class="form-group">
        <label>問題文</label>
        <input type="text" class="q-text" placeholder="例: 日本で一番高い山は？">
      </div>
      <div class="form-group">
        <label>選択肢（ラジオボタンで正解を指定）</label>
        ${[1, 2, 3, 4].map((n, idx) => `
          <div class="option-input-group">
            <input type="radio" name="correct-opt-${qCount}" value="${idx}" ${idx === 0 ? 'checked' : ''}>
            <input type="text" class="opt-${idx}" placeholder="選択肢 ${n}">
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(block);
  }

  function removeQuestionBlock(id) {
    document.getElementById(`q-block-${id}`).remove();
  }

  // クイズURLの生成
  async function generateQuiz() {
    const blocks = document.querySelectorAll('.q-block');
    const quizList = [];

    for (let block of blocks) {
      const qText = block.querySelector('.q-text').value.trim();
      const opts = [
        block.querySelector('.opt-0').value.trim(),
        block.querySelector('.opt-1').value.trim(),
        block.querySelector('.opt-2').value.trim(),
        block.querySelector('.opt-3').value.trim(),
      ];
      const selectedRadio = block.querySelector('input[type="radio"]:checked').value;
      const ansIndex = parseInt(selectedRadio);

      if (!qText || opts.some(o => !o)) {
        alert('すべての問題文と選択肢を入力してください');
        return;
      }

      const salt = generateSalt();
      const ansHash = await sha256(opts[ansIndex] + salt);
      quizList.push({ q: qText, opts, salt, ansHash });
    }

    const encoded = encodeData(quizList);
    const baseUrl = window.location.href.split('#')[0];
    const fullUrl = `${baseUrl}#q=${encoded}`;

    document.getElementById('share-url').innerText = fullUrl;
    document.getElementById('share-area').classList.remove('hidden');
  }

  function copyUrl() {
    navigator.clipboard.writeText(document.getElementById('share-url').innerText);
    const btn = document.getElementById('copy-btn');
    btn.innerText = 'コピー完了！';
    btn.style.background = 'var(--success)';
    setTimeout(() => { btn.innerText = 'URLをコピー'; btn.style.background = 'var(--primary)'; }, 2000);
  }

  // 回答モード：問題の表示処理
  function loadQuestion(index) {
    const qData = currentQuizData[index];
    document.getElementById('quiz-badge').innerText = `問 ${index + 1} / ${currentQuizData.length}`;
    document.getElementById('progress-bar').style.width = `${((index + 1) / currentQuizData.length) * 100}%`;
    document.getElementById('quiz-question').innerText = qData.q;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    document.getElementById('result-message').innerText = '';
    document.getElementById('next-btn').classList.add('hidden');

    qData.opts.forEach((opt) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option-btn';
      btn.innerText = opt;
      
      btn.onclick = async () => {
        const allBtns = container.querySelectorAll('.quiz-option-btn');
        allBtns.forEach(b => b.disabled = true);

        const userHash = await sha256(opt + qData.salt);
        const msgArea = document.getElementById('result-message');

        if (userHash === qData.ansHash) {
          btn.classList.add('correct');
          msgArea.innerText = '⭕ 正解！';
          msgArea.style.color = 'var(--success)';
          score++;
        } else {
          btn.classList.add('incorrect');
          msgArea.innerText = '❌ 不正解...';
          msgArea.style.color = 'var(--error)';
        }

        const nextBtn = document.getElementById('next-btn');
        nextBtn.innerText = (index === currentQuizData.length - 1) ? '結果を見る' : '次の問題へ';
        nextBtn.classList.remove('hidden');
      };
      container.appendChild(btn);
    });
  }

  function nextQuestion() {
    currentQIndex++;
    if (currentQIndex < currentQuizData.length) {
      loadQuestion(currentQIndex);
    } else {
      document.getElementById('play-mode').classList.add('hidden');
      document.getElementById('score-mode').classList.remove('hidden');
      document.getElementById('score-display').innerText = `${currentQuizData.length} 問中 ${score} 問正解`;
    }
  }

  function restartQuiz() {
    currentQIndex = 0;
    score = 0;
    document.getElementById('score-mode').classList.add('hidden');
    document.getElementById('play-mode').classList.remove('hidden');
    loadQuestion(0);
  }

  window.onload = function() {
    const hash = window.location.hash;
    if (hash && hash.startsWith('#q=')) {
      document.getElementById('create-mode').classList.add('hidden');
      document.getElementById('play-mode').classList.remove('hidden');
      try {
        currentQuizData = decodeData(hash.replace('#q=', ''));
        loadQuestion(0);
      } catch (e) {
        alert('クイズデータの読み込みに失敗しました');
      }
    } else {
      addQuestionBlock(); // 初期表示で第1問の入力枠を作成
    }
  };
</script>

</body>
</html>
