<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サーバーレス 高機能クイズメーカー</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --success: #10b981;
      --error: #ef4444;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container { width: 100%; max-width: 600px; }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 20px;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .header { text-align: center; margin-bottom: 24px; position: relative; }
    .header h1 { font-size: 1.5rem; margin: 0 0 8px 0; font-weight: 700; }
    .header p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }

    .nav-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:hover { background: #e2e8f0; color: var(--text); transform: translateY(-1px); }

    /* 問題作成ブロック */
    .q-block {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .q-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .q-title { font-weight: 700; font-size: 0.95rem; }
    
    .btn-delete {
      background: #fee2e2;
      color: var(--error);
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-delete:hover { background: #fca5a5; transform: scale(1.05); }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; }

    input[type="text"], select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
    }
    input[type="text"]:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }

    .option-input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .option-input-group input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3); }
    .btn:active { transform: translateY(0); scale: 0.98; }

    .btn-secondary {
      background: #ffffff;
      color: var(--primary);
      border: 2px solid var(--primary);
      box-shadow: none;
      margin-bottom: 16px;
    }
    .btn-secondary:hover { background: #f0f3ff; }

    /* 解答UI */
    .badge {
      background: #e0e7ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
    }

    .progress-container {
      width: 100%;
      background: var(--border);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; }

    .quiz-option-btn {
      width: 100%;
      padding: 16px;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: left;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .quiz-option-btn.correct {
      background: #ecfdf5;
      border-color: var(--success);
      color: #065f46;
      font-weight: 700;
    }
    .quiz-option-btn.incorrect {
      background: #fef2f2;
      border-color: var(--error);
      color: #991b1b;
    }

    .explanation-box {
      background: #f1f5f9;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin-top: 16px;
      font-size: 0.9rem;
    }

    #share-area {
      margin-top: 20px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px dashed var(--border);
      text-align: center;
    }
    #share-url { word-break: break-all; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      letter-spacing: 0.05em;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- 作成モード -->
  <div id="create-mode" class="card">
    <div class="header">
      <h1>Quiz Maker</h1>
      <p>複数形式対応 クイズメーカー</p>
    </div>

    <div id="questions-container"></div>

    <button class="btn btn-secondary" onclick="addQuestionBlock()">＋ 問題を追加する</button>
    <button class="btn" onclick="generateQuiz()">クイズURLを発行する</button>

    <div id="share-area" class="hidden">
      <div id="share-url"></div>
      <button class="btn" onclick="copyUrl()" id="copy-btn" style="margin-top: 10px;">URLをコピー</button>
    </div>
  </div>

  <!-- 回答モード -->
  <div id="play-mode" class="card hidden">
    <div class="header">
      <button class="nav-btn" onclick="goToCreate()">作成画面へ</button>
      <span id="quiz-badge" class="badge">問 1</span>
      <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
      <h2 id="quiz-question" style="margin: 0; font-size: 1.3rem;"></h2>
    </div>

    <div id="options-container"></div>
    <div id="result-message" style="text-align: center; font-weight: bold; margin-top: 12px;"></div>
    <div id="explanation-container" class="explanation-box hidden"></div>

    <button id="next-btn" class="btn hidden" onclick="nextQuestion()" style="margin-top: 16px;">次の問題へ</button>
  </div>

  <!-- スコア表示モード -->
  <div id="score-mode" class="card hidden" style="text-align: center;">
    <div class="header">
      <h1>クイズ終了！ 🎉</h1>
      <p>あなたの回答結果</p>
    </div>
    <div id="score-display" style="font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 20px 0;"></div>
    
    <button class="btn" onclick="restartQuiz()" style="margin-bottom: 10px;">もう一度挑戦する</button>
    <button class="btn btn-secondary" onclick="goToCreate()">自分もクイズを作る</button>
  </div>

  <footer>© tr0310 | Version 1.3.0</footer>
</div>

<script>
  let qCount = 0;
  let currentQuizData = [];
  let currentQIndex = 0;
  let score = 0;

  function normalizeText(str) {
    return str.trim().toLowerCase().replace(/\s+/g, '').replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
  }

  async function sha256(msg) {
    const uint8 = new TextEncoder().encode(msg);
    const buf = await crypto.subtle.digest('SHA-256', uint8);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function encodeData(data) {
    return btoa(encodeURIComponent(JSON.stringify(data)).replace(/%([0-9A-F]{2})/g, (m, p1) => String.fromCharCode('0x' + p1)));
  }

  function decodeData(str) {
    return JSON.parse(decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  }

  function goToCreate() {
    window.location.href = window.location.pathname;
  }

  function updateTypeUI(id) {
    const type = document.getElementById(`type-${id}`).value;
    const area = document.getElementById(`input-area-${id}`);
    
    if (type === 'select') {
      area.innerHTML = `
        <label>選択肢（ラジオボタンで正解を指定）</label>
        ${[1, 2, 3, 4].map((n, idx) => `
          <div class="option-input-group">
            <input type="radio" name="correct-${id}" value="${idx}" ${idx === 0 ? 'checked' : ''}>
            <input type="text" class="opt-${idx}" placeholder="選択肢 ${n}">
          </div>
        `).join('')}
      `;
    } else if (type === 'tf') {
      area.innerHTML = `
        <label>正解を選択</label>
        <div class="option-input-group">
          <input type="radio" name="correct-${id}" value="0" checked> ⭕ 正しい（TRUE）
        </div>
        <div class="option-input-group">
          <input type="radio" name="correct-${id}" value="1"> ❌ 誤り（FALSE）
        </div>
      `;
    } else if (type === 'text') {
      area.innerHTML = `
        <div class="form-group">
          <label>正解のキーワード</label>
          <input type="text" class="text-ans" placeholder="例: 富士山">
        </div>
      `;
    }
  }

  function addQuestionBlock() {
    qCount++;
    const container = document.getElementById('questions-container');
    const block = document.createElement('div');
    block.className = 'q-block';
    block.id = `q-block-${qCount}`;
    block.innerHTML = `
      <div class="q-block-header">
        <span class="q-title">問題 ${qCount}</span>
        ${qCount > 1 ? `<button class="btn-delete" onclick="document.getElementById('q-block-${qCount}').remove()">削除</button>` : ''}
      </div>
      <div class="form-group">
        <label>出題形式</label>
        <select id="type-${qCount}" onchange="updateTypeUI(${qCount})">
          <option value="select">4択形式</option>
          <option value="tf">〇×（二者択一）形式</option>
          <option value="text">記述（自由入力）形式</option>
        </select>
      </div>
      <div class="form-group">
        <label>問題文</label>
        <input type="text" class="q-text" placeholder="問題文を入力">
      </div>
      <div id="input-area-${qCount}" class="form-group"></div>
      <div class="form-group">
        <label>解説 (任意)</label>
        <input type="text" class="q-exp" placeholder="正解・不正解時に表示する解説">
      </div>
    `;
    container.appendChild(block);
    updateTypeUI(qCount);
  }

  async function generateQuiz() {
    const blocks = document.querySelectorAll('.q-block');
    const quizList = [];

    for (let block of blocks) {
      const id = block.id.replace('q-block-', '');
      const type = block.querySelector(`#type-${id}`).value;
      const qText = block.querySelector('.q-text').value.trim();
      const expText = block.querySelector('.q-exp').value.trim();
      const salt = Math.random().toString(36).substring(2, 8); 

      if (!qText) {
        alert('問題文を入力してください');
        return;
      }

      let targetText = '';
      let opts = [];
      let ansIndex = 0;

      if (type === 'select') {
        opts = [
          block.querySelector('.opt-0').value.trim(),
          block.querySelector('.opt-1').value.trim(),
          block.querySelector('.opt-2').value.trim(),
          block.querySelector('.opt-3').value.trim(),
        ];
        if (opts.some(o => !o)) { alert('選択肢をすべて入力してください'); return; }
        ansIndex = parseInt(block.querySelector(`input[name="correct-${id}"]:checked`).value);
        targetText = opts[ansIndex];
      } else if (type === 'tf') {
        opts = ['⭕ 正しい', '❌ 誤り'];
        ansIndex = parseInt(block.querySelector(`input[name="correct-${id}"]:checked`).value);
        targetText = opts[ansIndex];
      } else if (type === 'text') {
        const rawAns = block.querySelector('.text-ans').value.trim();
        if (!rawAns) { alert('正解のキーワードを入力してください'); return; }
        targetText = normalizeText(rawAns);
      }

      const ansHash = await sha256(targetText + salt);
      const tIdx = type === 'select' ? 1 : type === 'tf' ? 2 : 3;
      const correctVal = (type === 'text') ? block.querySelector('.text-ans').value.trim() : ansIndex;
      quizList.push([tIdx, qText, opts, expText, salt, ansHash, correctVal]);
    }

    const encoded = encodeData(quizList);
    const baseUrl = window.location.href.split('#')[0];
    const fullUrl = `${baseUrl}#q=${encoded}`;

    document.getElementById('share-area').classList.remove('hidden');
    document.getElementById('share-url').innerText = '短縮URLを生成中...';

    const randomId = Math.random().toString(36).substring(2, 7);
    const customShortId = `trq-${randomId}`;
    let finalUrl = fullUrl;

    try {
      const res = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(fullUrl)}&shorturl=${customShortId}`);
      const data = await res.json();
      if (data.shorturl) {
        finalUrl = data.shorturl;
      }
    } catch (err) {
      console.warn('API短縮に失敗しました。元のURLを表示します。', err);
    }

    document.getElementById('share-url').innerText = finalUrl;
  }

  function copyUrl() {
    navigator.clipboard.writeText(document.getElementById('share-url').innerText);
    const btn = document.getElementById('copy-btn');
    btn.innerText = 'コピー完了！';
    btn.style.background = 'var(--success)';
    setTimeout(() => { btn.innerText = 'URLをコピー'; btn.style.background = 'var(--primary)'; }, 2000);
  }

  function loadQuestion(index) {
    const qData = currentQuizData[index];
    document.getElementById('quiz-badge').innerText = `問 ${index + 1} / ${currentQuizData.length}`;
    document.getElementById('progress-bar').style.width = `${((index + 1) / currentQuizData.length) * 100}%`;
    document.getElementById('quiz-question').innerText = qData.q;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    document.getElementById('result-message').innerText = '';
    
    const expBox = document.getElementById('explanation-container');
    expBox.classList.add('hidden');
    expBox.innerText = '';

    document.getElementById('next-btn').classList.add('hidden');

    if (qData.type === 'select' || qData.type === 'tf') {
      qData.opts.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, qData, btn);
        container.appendChild(btn);
      });
    } else if (qData.type === 'text') {
      container.innerHTML = `
        <input type="text" id="text-input" placeholder="回答を入力してください" style="margin-bottom: 12px;">
        <button class="btn" id="submit-text-btn">回答を送信</button>
      `;
      document.getElementById('submit-text-btn').onclick = () => {
        const val = document.getElementById('text-input').value;
        checkAnswer(normalizeText(val), qData, null);
      };
    }
  }

  async function checkAnswer(userInput, qData, clickedBtn) {
    const userHash = await sha256(userInput + qData.salt);
    const msgArea = document.getElementById('result-message');
    const isCorrect = (userHash === qData.ansHash);

    document.querySelectorAll('.quiz-option-btn').forEach(b => b.disabled = true);
    const textInput = document.getElementById('text-input');
    if (textInput) textInput.disabled = true;
    const submitBtn = document.getElementById('submit-text-btn');
    if (submitBtn) submitBtn.disabled = true;

    if (isCorrect) {
      if (clickedBtn) clickedBtn.classList.add('correct');
      msgArea.innerText = '⭕ 正解！';
      msgArea.style.color = 'var(--success)';
      score++;
    } else {
      if (clickedBtn) clickedBtn.classList.add('incorrect');
      msgArea.innerText = '❌ 不正解...';
      msgArea.style.color = 'var(--error)';

      if (qData.type === 'select' || qData.type === 'tf') {
        const optionButtons = document.querySelectorAll('.quiz-option-btn');
        if (optionButtons[qData.correctVal]) {
          optionButtons[qData.correctVal].classList.add('correct');
        }
      } else if (qData.type === 'text') {
        msgArea.innerText += ` （正解: ${qData.correctVal}）`;
      }
    }

    if (qData.exp) {
      const expBox = document.getElementById('explanation-container');
      expBox.innerText = `【解説】 ${qData.exp}`;
      expBox.classList.remove('hidden');
    }

    const nextBtn = document.getElementById('next-btn');
    nextBtn.innerText = (currentQIndex === currentQuizData.length - 1) ? '結果を見る' : '次の問題へ';
    nextBtn.classList.remove('hidden');
  }

  function nextQuestion() {
    currentQIndex++;
    if (currentQIndex < currentQuizData.length) {
      loadQuestion(currentQIndex);
    } else {
      document.getElementById('play-mode').classList.add('hidden');
      document.getElementById('score-mode').classList.remove('hidden');
      document.getElementById('score-display').innerText = `${currentQuizData.length} 問中 ${score} 問正解`;
    }
  }

  function restartQuiz() {
    currentQIndex = 0;
    score = 0;
    document.getElementById('score-mode').classList.add('hidden');
    document.getElementById('play-mode').classList.remove('hidden');
    loadQuestion(0);
  }

  window.onload = function() {
    const hash = window.location.hash;
    if (hash && hash.startsWith('#q=')) {
      document.getElementById('create-mode').classList.add('hidden');
      document.getElementById('play-mode').classList.remove('hidden');
      try {
        const decoded = decodeData(hash.replace('#q=', ''));
        currentQuizData = decoded.map(item => {
          if (Array.isArray(item)) {
            return {
              type: item[0] === 1 ? 'select' : item[0] === 2 ? 'tf' : 'text',
              q: item[1],
              opts: item[2],
              exp: item[3],
              salt: item[4],
              ansHash: item[5],
              correctVal: item[6]
            };
          }
          return item; 
        });
        loadQuestion(0);
      } catch (e) {
        alert('クイズデータの読み込みに失敗しました');
      }
    } else {
      addQuestionBlock();
    }
  };
</script>

</body>
</html>
