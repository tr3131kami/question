<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener & Share</title>
  <!-- QRコード生成ライブラリ (QRCode.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 440px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #64748b;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* スライドスイッチのデザイン */
    .switch-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: #f1f5f9;
      border-radius: 10px;
    }

    .switch-label {
      font-size: 14px;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* ボタンエリア */
    .action-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-qr {
      background-color: #0284c7;
      color: white;
    }
    .btn-qr:hover { background-color: #0369a1; }

    .btn-share {
      background-color: var(--primary);
      color: white;
    }
    .btn-share:hover { background-color: var(--primary-hover); }

    /* モーダル表示 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      width: 90%;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 16px 0;
    }

    .close-btn {
      background: #e2e8f0;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* 通知トースト */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      display: none;
      z-index: 1001;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="form-group">
      <label for="urlInput">対象URL</label>
      <input type="text" id="urlInput" value="https://example.com/share/page123" placeholder="https://...">
    </div>

    <div class="form-group">
      <label for="passInput">パスワード</label>
      <input type="password" id="passInput" value="pass1234" placeholder="パスワードを入力">
    </div>

    <!-- パスワードの共有オン/オフ切り替えスイッチ -->
    <div class="switch-container">
      <span class="switch-label">パスワードも共有に含める</span>
      <label class="switch">
        <input type="checkbox" id="includePassToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- QRコード & 共有ボタン -->
    <div class="action-group">
      <button class="btn btn-qr" onclick="showQRCode()">
        <span>QRコード</span>
      </button>
      <button class="btn btn-share" onclick="shareUrl()">
        <span>共有</span>
      </button>
    </div>
  </div>

  <!-- QRコードモーダル -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal">
      <h3 style="margin: 0; font-size: 16px;">短縮QRコード</h3>
      <div id="qrcode"></div>
      <p id="qrUrlText" style="font-size: 11px; color: #64748b; word-break: break-all; margin-bottom: 16px;"></p>
      <button class="close-btn" onclick="closeQRModal()">閉じる</button>
    </div>
  </div>

  <div class="toast" id="toast">コピーしました！</div>

  <script>
    // 短縮URLの生成（疑似短縮処理）
    function generateShortUrl() {
      const baseUrl = document.getElementById('urlInput').value.trim();
      const pass = document.getElementById('passInput').value;
      const includePass = document.getElementById('includePassToggle').checked;

      if (!baseUrl) return '';

      // URLをベース64化した一部を用いて擬似的な短縮キーを発行
      const hash = btoa(encodeURIComponent(baseUrl)).replace(/=/g, '').substring(0, 8);
      let shortUrl = `https://sho.rt/${hash}`;

      // スライドスイッチがONかつパスワードが存在する場合パラメータを付与
      if (includePass && pass) {
        shortUrl += `?pwd=${encodeURIComponent(pass)}`;
      }

      return shortUrl;
    }

    // QRコードの表示
    function showQRCode() {
      const targetUrl = generateShortUrl();
      if (!targetUrl) {
        alert('URLを入力してください');
        return;
      }

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';

      new QRCode(qrContainer, {
        text: targetUrl,
        width: 160,
        height: 160
      });

      document.getElementById('qrUrlText').innerText = targetUrl;
      document.getElementById('qrModal').classList.add('active');
    }

    function closeQRModal() {
      document.getElementById('qrModal').classList.remove('active');
    }

    // 共有処理（Web Share API / クリップボードコピー）
    async function shareUrl() {
      const targetUrl = generateShortUrl();
      if (!targetUrl) {
        alert('URLを入力してください');
        return;
      }

      if (navigator.share) {
        try {
          await navigator.share({
            title: '共有リンク',
            url: targetUrl
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            copyToClipboard(targetUrl);
          }
        }
      } else {
        copyToClipboard(targetUrl);
      }
    }

    // クリップボードへのコピー機能
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('短縮URLをコピーしました！');
      }).catch(() => {
        alert('コピーに失敗しました');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2000);
    }
  </script>
</body>
</html>
